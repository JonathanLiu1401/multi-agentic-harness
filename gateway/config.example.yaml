# CLIProxyAPI - minimal config (defaults per upstream config.example.yaml)
# Bound to loopback only; upstream default of "" would bind all interfaces.
host: "127.0.0.1"
port: 8317

auth-dir: "~/.cli-proxy-api"

# Local client key. Claude Code sends this as ANTHROPIC_AUTH_TOKEN.
api-keys:
  - "ccp-your-local-client-api-key-here"

debug: false

# OpenAI compatibility providers (e.g. DeepSeek for cld launcher)
openai-compatibility:
  - name: "deepseek"
    base-url: "https://api.deepseek.com"
    api-key-entries:
      - api-key: "your-deepseek-api-key-here"
    models:
      - name: "deepseek-chat"
        alias: "deepseek-chat"
        display-name: "DeepSeek V3"
        max-context-length: 65536
      - name: "deepseek-reasoner"
        alias: "deepseek-reasoner"
        display-name: "DeepSeek R1"
        max-context-length: 65536
        thinking:
          levels: ["high", "medium", "low"]
